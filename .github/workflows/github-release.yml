name: NuGet Release

on:
  release:
    types: [published]

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore ./unfoldedcircle.slnx --locked-mode

      - name: Build
        run: dotnet build ./unfoldedcircle.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Compute package version from release tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=${TAG#v}
          if [[ -z "$VERSION" ]]; then
            echo "Release tag name is empty" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Pack libraries
        run: |
          dotnet pack ./src/UnfoldedCircle.Models/UnfoldedCircle.Models.csproj --configuration Release --no-build --output ./artifacts -p:Version=$PACKAGE_VERSION
          dotnet pack ./src/UnfoldedCircle.Server/UnfoldedCircle.Server.csproj --configuration Release --no-build --output ./artifacts -p:Version=$PACKAGE_VERSION

      - name: NuGet Login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login
        with:
          user: henrikwidlund

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NUGET_PAT secret is not set" >&2
            exit 1
          fi
          dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
